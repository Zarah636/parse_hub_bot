name: ARM64 Docker Image CI

on:
  push:
    branches:
      - zeee/upstream-flyinglife-fallback
  workflow_dispatch:

concurrency:
  group: arm64-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          pull: true
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/zarah636/parse_hub_bot:latest
            ghcr.io/zarah636/parse_hub_bot:arm64-latest
            ghcr.io/zarah636/parse_hub_bot:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image digest
        run: echo "ARM64 image digest=${{ steps.build.outputs.digest }}"
